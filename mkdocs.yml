site_name: SANEI メール自動処理 · 画面マニュアル
site_description: ブッキング・S/R・危険物メールの AI 自動処理 — 担当者向け画面の使い方（日本語・한국어）
site_url: https://sinokorofficial.github.io/jp-mail-docs/
repo_name: jp-mail-docs
repo_url: https://github.com/SinokorOfficial/jp-mail-docs
docs_dir: docs

nav:
  - 日本語: index.md
  - 한국어: ko.md
  - 개발 문서:
      - 공통 구조·운영: dev/overview.md
      - 부킹 → ULOGI 부킹 저장: dev/booking_ulogi_spec.md
      - S/R → ULOGI House B/L 저장: dev/sr_hbl_spec.md
      - 위험물 → SKRAI 적재·포털: dev/dg_skrai_spec.md
      - 수입 A/N → ULOGI 전송: dev/an_ulogi_spec.md

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/weather-night
        name: ダークモード
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: ライトモード
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences:            # ```mermaid 플로우차트 (개발 문서)
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
